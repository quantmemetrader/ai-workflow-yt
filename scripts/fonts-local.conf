<?xml version="1.0"?>
<!-- Install with: sudo cp scripts/fonts-local.conf /etc/fonts/local.conf && sudo fc-cache -f -->
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Simplified Chinese only, on this box.

  Noto Sans CJK ships SC, TC, HK, JP and KR in one file, and fontconfig picked
  whichever came first when nothing declared a language. The same code point is
  drawn differently in each, so a render could come back with Japanese or
  Traditional letterforms over correct Simplified text. Appending the SC cut to
  the generic families settles it for anything that falls through — ffmpeg's
  libass, Chromium under Remotion, ImageMagick, all of them.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <!-- And when something asks for a CJK family by the wrong regional name,
       hand it the Simplified one. -->
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK HK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang HK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang TC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>
