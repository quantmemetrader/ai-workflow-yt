<style id="css-desktop" media="not all">
    html, body { overflow: hidden; }
    body { margin: 0; font-family: Inter, 'PingFang HK', 'Noto Sans HK', system-ui, sans-serif; font-weight: 420; letter-spacing: 0.02em; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #007be0; text-decoration: none; }
    img { display: block; }
    p { margin: 0; }

    @keyframes fadeUp { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes rowIn  { from { transform: translateY(7px);  opacity: 0 } to { transform: none; opacity: 1 } }
    .scr { animation: fadeUp .24s cubic-bezier(.32,.72,0,1) both; }
    .tr  { animation: rowIn .3s cubic-bezier(.32,.72,0,1) both; }
    .tr:nth-of-type(1){animation-delay:.01s} .tr:nth-of-type(2){animation-delay:.035s}
    .tr:nth-of-type(3){animation-delay:.06s} .tr:nth-of-type(4){animation-delay:.085s}
    .tr:nth-of-type(5){animation-delay:.11s} .tr:nth-of-type(6){animation-delay:.135s}
    .tr:nth-of-type(7){animation-delay:.16s} .tr:nth-of-type(8){animation-delay:.185s}

    /* rail */
    .r { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #7c7c7c; transition: background .16s ease, color .16s ease; }
    .r svg { width: 17px; height: 17px; fill: currentColor; }
    .r.on { background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #171717; }
    .r.no { opacity: .32; }

    /* sidebar */
    .n { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; color: #525252; transition: background .16s ease; }
    .n.on { background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #171717; font-weight: 500; }
    .n b { margin-left: auto; font-size: 10.5px; font-weight: 500; color: #999999; }
    .n i { margin-left: auto; font-style: normal; display: inline-flex; align-items: center; height: 17px; padding: 0 6px; border-radius: 9px; background: #ffe7e7; color: #e03636; font-size: 10px; font-weight: 500; }
    .lbl { font-size: 10.5px; font-weight: 500; color: #999999; padding: 0 9px; }

    /* generic */
    .bar { height: 48px; flex-shrink: 0; border-bottom: 1px solid #ededed; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
    .h1 { font-size: 14px; font-weight: 500; }
    .mut { font-size: 12px; color: #999999; }
    .btn { height: 30px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
    .btn.p { background: #007be0; color: #fff; font-weight: 500; }
    .btn.s { border: 1px solid #ededed; color: #525252; }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 1px solid #ededed; border-radius: 8px; font-size: 12px; color: #4a5763; white-space: nowrap; }
    .chip svg { width: 10px; height: 10px; stroke: #999999; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bd { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .gray { background: #f3f3f3; color: #525252 }
    .blue { background: #e6f4ff; color: #007be0 }
    .grn  { background: #e4faeb; color: #278f5e }
    .amb  { background: #fff7d3; color: #db7706 }
    .red  { background: #ffe7e7; color: #e03636 }
    .card { border: 1px solid #ededed; border-radius: 12px; background: #fff; padding: 16px; }
    .kv { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 12.5px; }
    .kv span:first-child { color: #999999; }
    .av { width: 20px; height: 20px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .stat { border: 1px solid #ededed; border-radius: 12px; padding: 13px 15px; background: #fff; }
    .stat i { font-style: normal; display: block; font-size: 10.5px; font-weight: 500; color: #999999; }
    .stat b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }

    /* table */
    .t { width: 100%; }
    .t .hd { height: 32px; border-bottom: 1px solid #ededed; display: grid; align-items: center; }
    .t .hd > * { font-size: 10.5px; font-weight: 500; color: #7c7c7c; padding: 0 12px; }
    .tr { height: 46px; border-bottom: 1px solid #f3f3f3; display: grid; align-items: center; }
    .tr > * { font-size: 12.5px; color: #383838; padding: 0 12px; min-width: 0; display: flex; align-items: center; }
    .num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
    .el { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .body { flex-grow: 1; min-height: 0; padding: 18px 20px; overflow: hidden; }
    .focus { box-shadow: 0 0 0 3px #EFF6FF; }
  
    .tabs { height: 40px; flex-shrink: 0; display: flex; align-items: stretch; gap: 20px; padding: 0 22px; border-bottom: 1px solid #ededed; }
    .tb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #7c7c7c; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .tb.on { color: #171717; font-weight: 500; border-color: #171717; }
    .tb b { font-size: 10.5px; font-weight: 500; color: #999999; }
    .tb i { font-style: normal; display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 8px; background: #e6f4ff; color: #007be0; font-size: 10px; font-weight: 500; }
    .rtab { height: 26px; padding: 0 11px; border-radius: 7px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7c7c7c; }
    .rtab.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); color: #171717; font-weight: 500; }
    .cap { font-size: 11px; color: #999999; }
    .seg { width: 30px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .seg svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .fc { height: 26px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #525252; border: 1px solid #ededed; background: #fff; white-space: nowrap; }
    .fc b { font-weight: 500; color: #999999; font-size: 11px; }
    .fc.on { background: #171717; border-color: #171717; color: #fff; }
    .fc.on b { color: #c7c7c7; }
    .fc svg { width: 10px; height: 10px; stroke: #999999; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dot { width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; }
    .kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px; border: 1px solid #e2e2e2; font-size: 10.5px; color: #7c7c7c; background: #fafafa; }
    .ck { width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ck svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #999999; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .cb.on { border: none; background: #171717; }
    .cb svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .li { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid #f3f3f3; }
    .li .a { font-size: 12.5px; color: #171717; }
    .li .b { font-size: 11.5px; color: #999999; margin-top: 2px; }

    /* item switcher (left sidebar inside a document / project) */
    .sn { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; color: #525252; }
    .sn > span:not(.dot) { flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sn.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); color: #171717; font-weight: 500; }
    .sn img.av { width: 16px; height: 16px; border-radius: 8px; }
    .sg { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 500; color: #999999; padding: 0 9px; margin: 14px 0 4px; }
    .sg svg { width: 10px; height: 10px; stroke: #999999; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ptog { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #7c7c7c; cursor: pointer; flex-shrink: 0; }
    .ptog:hover { background: #ededed; }
    .ptog svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .mini { width: 52px; flex-shrink: 0; background: #f8f8f8; border-right: 1px solid #ededed; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
    .mi { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; position: relative; }
    .mi.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .mi .dot { position: absolute; right: 3px; bottom: 3px; box-shadow: 0 0 0 2px #f8f8f8; }
    .mi.on .dot { box-shadow: 0 0 0 2px #fff; }
    .crop { background-repeat: no-repeat; background-color: #f3f3f3; }
    .bd.vio { background: #f3f0ff; color: #6846e3; }
    .costc { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 1px solid #ededed; border-radius: 8px; font-size: 12px; color: #383838; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .costc .m { width: 40px; height: 4px; border-radius: 2px; background: #ededed; }
    .costc .m div { height: 4px; border-radius: 2px; background: var(--ac); }
    .sth { position: relative; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; }
    .pill { position: absolute; height: 18px; padding: 0 6px; border-radius: 5px; background: rgba(255,255,255,.94); font-size: 10.5px; font-weight: 500; color: #171717; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pill.dk { background: rgba(23,23,23,.72); color: #fff; }
    .stt { font-size: 12.5px; font-weight: 500; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; }
    .srow .st { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11px; color: #7c7c7c; white-space: nowrap; }
    .beat { display: flex; gap: 10px; padding: 8px 10px; border-radius: 8px; }
    .beat.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .beat .bnum { font-size: 10.5px; color: #999999; font-weight: 500; width: 36px; flex-shrink: 0; font-variant-numeric: tabular-nums; line-height: 1.5; }
    .beat .bnum b { display: block; font-weight: 500; color: #c7c7c7; }
    .beat .x { font-size: 12px; line-height: 1.45; color: #383838; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 0; flex-grow: 1; }
    .seg2 { height: 34px; border-radius: 5px; position: relative; overflow: hidden; min-width: 0; display: flex; align-items: flex-end; padding: 0 0 3px 5px; font-size: 10px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
    .qh { display: flex; align-items: center; gap: 8px; margin: 12px 0 2px; font-size: 11px; font-weight: 500; color: #7c7c7c; }
    .qh b { font-weight: 500; color: #c7c7c7; }
    .qr { display: grid; grid-template-columns: 26px minmax(0, 1fr) 92px 128px 46px 150px 74px; align-items: center; height: 40px; border-bottom: 1px solid #f3f3f3; font-size: 12.5px; color: #383838; }
    .qr > * { padding: 0 7px; min-width: 0; display: flex; align-items: center; gap: 7px; }
    .qr .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .qr .num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
    .pos { width: 18px; height: 18px; border-radius: 5px; background: #f3f3f3; color: #525252; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .pbar { height: 4px; border-radius: 2px; background: #ededed; flex-grow: 1; position: relative; overflow: hidden; }
    .pbar div { height: 4px; border-radius: 2px; background: var(--ac); }
    .floor { background-color: #fcfcfc; background-image: linear-gradient(45deg, #f5f5f5 25%, transparent 25%, transparent 75%, #f5f5f5 75%), linear-gradient(45deg, #f5f5f5 25%, transparent 25%, transparent 75%, #f5f5f5 75%); background-size: 12px 12px; background-position: 0 0, 6px 6px; }
    .lbl2 { font-size: 12px; font-weight: 500; color: #171717; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lbl3 { font-size: 11px; color: #999999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .ctile { min-width: 0; }
    .cth { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; }
    .cn { font-size: 12px; color: #171717; margin-top: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hov { position: absolute; inset: 0; background: rgba(23,23,23,.42); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .hb { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; }
    .hb svg { width: 14px; height: 14px; stroke: #171717; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .slot { flex: 1 1 0; min-width: 0; }
    .slot .sb { height: 44px; border-radius: 7px; position: relative; overflow: hidden; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
    .slot .sl { font-size: 10.5px; color: #999999; margin-top: 5px; text-align: center; font-variant-numeric: tabular-nums; }
    .lane { position: relative; height: 40px; border-radius: 7px; background: #fafafa; overflow: hidden; }
    .tk { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 9px; border-radius: 8px; font-size: 12px; color: #383838; }
    .tk.on { background: #f8f8f8; }
    .play { width: 24px; height: 24px; border-radius: 12px; background: #fff; border: 1px solid #e2e2e2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .play svg { width: 10px; height: 10px; fill: #171717; }
    .aspb { height: 26px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
    .cut { flex-shrink: 0; cursor: pointer; }
    .cut .cb2 { height: 68px; display: flex; align-items: flex-end; }
    .cut .ci { border-radius: 6px; overflow: hidden; position: relative; }

    /* pixel render floor */
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes steam { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-4px); opacity: 0; } }
    @keyframes smoke { 0% { transform: translate(0, 0); opacity: .9; } 100% { transform: translate(2px, -6px); opacity: 0; } }
    @keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(3px, -5px); opacity: 0; } }
    @keyframes belt { 0% { transform: translateX(0); } 100% { transform: translateX(14px); } }
    @keyframes roll { to { stroke-dashoffset: -4; } }
    @keyframes type { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
    .bob { animation: bob .9s steps(1, end) infinite; }
    .type { animation: type .3s steps(1, end) infinite; }
    .type2 { animation: type .3s steps(1, end) infinite .15s; }
    .blink { animation: blink 1s steps(1, end) infinite; }
    .steam { animation: steam 1.6s steps(4) infinite; }
    .smoke { animation: smoke 1.8s steps(6) infinite; }
    .smoke2 { animation: smoke 1.8s steps(6) infinite .9s; }
    .zz { animation: zz 2.4s steps(6) infinite; }
    .zz2 { animation: zz 2.4s steps(6) infinite 1.2s; }
    .belt { animation: belt 2.8s steps(14) infinite; }
    .roll { animation: roll .5s steps(2) infinite; }</style>
