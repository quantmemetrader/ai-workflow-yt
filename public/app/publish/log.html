<style id="css-desktop" media="not all">
    html, body { overflow: hidden; }

    @keyframes fadeUp { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes rowIn  { from { transform: translateY(7px);  opacity: 0 } to { transform: none; opacity: 1 } }
    .scr { animation: fadeUp .24s cubic-bezier(.32,.72,0,1) both; }
    .tr  { animation: rowIn .3s cubic-bezier(.32,.72,0,1) both; }

    .tr:nth-of-type(3){animation-delay:.06s} .tr:nth-of-type(4){animation-delay:.085s}
    .tr:nth-of-type(5){animation-delay:.11s} .tr:nth-of-type(6){animation-delay:.135s}

    /* rail */

    .r.on { background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #171717; }

    /* sidebar */

    /* generic */

    .h1 { font-size: 14px; font-weight: 500; }
    .mut { font-size: 12px; color: #999999; }
    .btn { height: 30px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
    .btn.p { background: #007be0; color: #fff; font-weight: 500; }
    .btn.s { border: 1px solid #ededed; color: #525252; }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 1px solid #ededed; border-radius: 8px; font-size: 12px; color: #4a5763; white-space: nowrap; }
    .chip svg { width: 10px; height: 10px; stroke: #999999; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bd { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .gray { background: #f3f3f3; color: #525252 }
    .blue { background: #e6f4ff; color: #007be0 }
    .grn  { background: #e4faeb; color: #278f5e }
    .amb  { background: #fff7d3; color: #db7706 }
    .red  { background: #ffe7e7; color: #e03636 }
    .card { border: 1px solid #ededed; border-radius: 12px; background: #fff; padding: 16px; }
    .kv { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 12.5px; }
    .kv span:first-child { color: #999999; }
    .av { width: 20px; height: 20px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .stat { border: 1px solid #ededed; border-radius: 12px; padding: 13px 15px; background: #fff; }
    .stat i { font-style: normal; display: block; font-size: 10.5px; font-weight: 500; color: #999999; }
    .stat b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }

    /* table */
    .t { width: 100%; }
    .t .hd { height: 32px; border-bottom: 1px solid #ededed; display: grid; align-items: center; }
    .t .hd > * { font-size: 10.5px; font-weight: 500; color: #7c7c7c; padding: 0 12px; }
    .tr { height: 46px; border-bottom: 1px solid #f3f3f3; display: grid; align-items: center; }
    .tr > * { font-size: 12.5px; color: #383838; padding: 0 12px; min-width: 0; display: flex; align-items: center; }
    .num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
    .el { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .body { flex-grow: 1; min-height: 0; padding: 18px 20px; overflow: hidden; }
    .focus { box-shadow: 0 0 0 3px #EFF6FF; }

    .tb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #7c7c7c; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }

    .tb b { font-size: 10.5px; font-weight: 500; color: #999999; }
    .tb i { font-style: normal; display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 8px; background: #e6f4ff; color: #007be0; font-size: 10px; font-weight: 500; }

    .cap { font-size: 11px; color: #999999; }
    .seg { width: 30px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .seg svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .fc { height: 26px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #525252; border: 1px solid #ededed; background: #fff; white-space: nowrap; }
    .fc b { font-weight: 500; color: #999999; font-size: 11px; }
    .fc.on { background: #171717; border-color: #171717; color: #fff; }
    .fc.on b { color: #c7c7c7; }
    .fc svg { width: 10px; height: 10px; stroke: #999999; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dot { width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; }
    .kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px; border: 1px solid #e2e2e2; font-size: 10.5px; color: #7c7c7c; background: #fafafa; }
    .ck { width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ck svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #999999; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .cb.on { border: none; background: #171717; }
    .cb svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .li { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid #f3f3f3; }
    .li .a { font-size: 12.5px; color: #171717; }
    .li .b { font-size: 11.5px; color: #999999; margin-top: 2px; }

    /* item switcher (left sidebar inside a document / project) */
    .sn { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; color: #525252; }
    .sn > span:not(.dot) { flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sn.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); color: #171717; font-weight: 500; }
    .sn img.av { width: 16px; height: 16px; border-radius: 8px; }
    .sg { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 500; color: #999999; padding: 0 9px; margin: 14px 0 4px; }
    .sg svg { width: 10px; height: 10px; stroke: #999999; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ptog { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #7c7c7c; cursor: pointer; flex-shrink: 0; }
    .ptog:hover { background: #ededed; }
    .ptog svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .mini { width: 52px; flex-shrink: 0; background: #f8f8f8; border-right: 1px solid #ededed; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
    .mi { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; position: relative; }
    .mi.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .mi .dot { position: absolute; right: 3px; bottom: 3px; box-shadow: 0 0 0 2px #f8f8f8; }
    .mi.on .dot { box-shadow: 0 0 0 2px #fff; }
    .logo { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: block; }
    .sec { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .sec b { font-size: 13px; font-weight: 500; color: #171717; }
    .grid .gh, .grid .gr { display: grid; grid-template-columns: minmax(0, 1fr) repeat(6, 76px); align-items: center; }
    .grid .gh { height: 40px; border-bottom: 1px solid #ededed; }
    .grid .gh > div:nth-child(n+2) { display: flex; justify-content: center; }
    .grid .gr { height: 52px; border-bottom: 1px solid #f3f3f3; }
    .grid .gr:last-child { border-bottom: none; }
    .grid .gr > div:nth-child(n+2) { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .cell { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .cell svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .cd { font-size: 10px; color: #999999; white-space: nowrap; }
    .cl .ch2, .cl .cr { display: grid; grid-template-columns: minmax(0, 1.2fr) 150px minmax(0, 1fr) 128px 96px; align-items: center; }
    .cl .ch2 { height: 28px; border-bottom: 1px solid #ededed; }
    .cl .ch2 > * { font-size: 10.5px; font-weight: 500; color: #7c7c7c; padding: 0 10px; }
    .cl .cr { height: 40px; border-bottom: 1px solid #f3f3f3; }
    .cl .cr:last-child { border-bottom: none; }
    .cl .cr > * { font-size: 12.5px; color: #383838; padding: 0 10px; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .el { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .qm { height: 4px; border-radius: 2px; background: #ededed; flex-grow: 1; }
    .qm div { height: 4px; border-radius: 2px; background: var(--ac); }
    .ctab { height: 40px; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #7c7c7c; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .ctab.on { color: #171717; font-weight: 500; border-color: #171717; }
    .ctab .od { width: 6px; height: 6px; border-radius: 3px; background: #f5a524; }
    .fl { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; color: #7c7c7c; margin-bottom: 6px; }
    .fl .cnt { margin-left: auto; font-weight: 420; color: #999999; font-variant-numeric: tabular-nums; }
    .inp { min-height: 34px; border-radius: 8px; background: #f3f3f3; display: flex; align-items: center; gap: 8px; padding: 0 11px; font-size: 13px; color: #171717; }
    .tagc { height: 24px; padding: 0 9px; border-radius: 7px; background: #fff; border: 1px solid #e2e2e2; font-size: 12px; display: inline-flex; align-items: center; }
    .ap { border: 1px solid #ededed; border-radius: 14px; background: #fff; padding: 12px; display: flex; gap: 14px; align-items: center; }
    .ap.on { border-color: #d6eafc; box-shadow: 0 0 0 3px #eff6ff; }
    .ibtn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #ededed; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #525252; white-space: nowrap; }
    .ibtn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .lg2 .lr { display: grid; grid-template-columns: 52px minmax(0, 1fr) 130px 40px minmax(0, 1.1fr); align-items: center; height: 48px; border-bottom: 1px solid #f3f3f3; font-size: 12.5px; color: #383838; }
    .lg2 .lr > * { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; }
    .day { font-size: 11px; font-weight: 500; color: #7c7c7c; margin: 14px 0 2px 8px; }</style>
